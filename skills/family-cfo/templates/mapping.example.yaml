# 示例：未知格式账单的字段映射
# 保存到 config/mappings.yaml 的 mappings 段，即可用 --mapping-name 复用。
# 规则：date 必填；amount 与 inflow/outflow 至少一组；其余可留空。
mappings:
  cmb_credit:
    platform: bank
    label: 招商银行信用卡流水
    mapping:
      date: 交易日期
      amount: 人民币金额
      direction: 借贷标志
      counterparty: 交易描述
      external_id: 流水号
      description: 备注
  generic_wallet:
    platform: other
    label: 某钱包导出
    mapping:
      date: 日期
      amount: 金额
      direction: 方向
      counterparty: 对方
      description: 说明
      external_id: 订单号
