version: 1
# Feishu Bitable schema used by Family CFO.
# Create the Bitable first (https://feishu.cn/base), then add the app as a
# collaborator, then run: family-cfo feishu-sync --ensure-tables
# Field type ids: text=1, number=2, single_select=3, date=5, checkbox=7, url=15
tables:
  transactions:
    name: FamilyCFO_交易明细
    entity: transaction
    primary_field: 业务ID
    periodic: month
    fields:
      - { name: 业务ID, type: text }
      - { name: 日期, type: date }
      - { name: 方向, type: text }
      - { name: 类型, type: text }
      - { name: 金额, type: number }
      - { name: 币种, type: text }
      - { name: 分类, type: text }
      - { name: 账户, type: text }
      - { name: 对方, type: text }
      - { name: 说明, type: text }
      - { name: 状态, type: text }
      - { name: 来源, type: text }
      - { name: 纳入统计, type: checkbox }
      - { name: 月份, type: text }
  assets:
    name: FamilyCFO_资产
    entity: asset
    primary_field: 业务ID
    fields:
      - { name: 业务ID, type: text }
      - { name: 名称, type: text }
      - { name: 类型, type: text }
      - { name: 估值, type: number }
      - { name: 成本, type: number }
      - { name: 流动资产, type: checkbox }
      - { name: 自住房, type: checkbox }
      - { name: 估值日期, type: date }
      - { name: 估值来源, type: text }
  liabilities:
    name: FamilyCFO_负债
    entity: liability
    primary_field: 业务ID
    fields:
      - { name: 业务ID, type: text }
      - { name: 名称, type: text }
      - { name: 类型, type: text }
      - { name: 余额, type: number }
      - { name: 利率, type: number }
      - { name: 月供, type: number }
      - { name: 下次还款日, type: date }
      - { name: 剩余月数, type: number }
  budgets:
    name: FamilyCFO_预算
    entity: budget_item
    primary_field: 业务ID
    fields:
      - { name: 业务ID, type: text }
      - { name: 账期, type: text }
      - { name: 版本, type: number }
      - { name: 分类, type: text }
      - { name: 预算金额, type: number }
      - { name: 实际金额, type: number }
      - { name: 执行率, type: number }
      - { name: 预算ID, type: text }
  goals:
    name: FamilyCFO_目标
    entity: goal
    primary_field: 业务ID
    fields:
      - { name: 业务ID, type: text }
      - { name: 名称, type: text }
      - { name: 类型, type: text }
      - { name: 目标金额, type: number }
      - { name: 当前金额, type: number }
      - { name: 目标日期, type: date }
      - { name: 每月储蓄, type: number }
      - { name: 缺口, type: number }
      - { name: 完成率, type: number }
      - { name: 风险承受, type: text }
  monthly_reports:
    name: FamilyCFO_月度报告
    entity: monthly_report
    primary_field: 业务ID
    fields:
      - { name: 业务ID, type: text }
      - { name: 账期, type: text }
      - { name: 结算状态, type: text }
      - { name: 收入, type: number }
      - { name: 支出, type: number }
      - { name: 结余, type: number }
      - { name: 储蓄率, type: number }
      - { name: 总资产, type: number }
      - { name: 总负债, type: number }
      - { name: 净资产, type: number }
      - { name: 生成日期, type: date }
