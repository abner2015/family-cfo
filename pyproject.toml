[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "family-cfo"
version = "0.1.0"
description = "Family CFO — local-first family finance ledger, analytics, monthly close and Feishu Bitable sync"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Family CFO" }]
keywords = ["personal-finance", "family", "accounting", "feishu", "bitable", "agent"]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.11",
  "Topic :: Office/Business :: Financial :: Accounting",
]

dependencies = [
  "SQLAlchemy>=2.0.30,<2.1",
  "alembic>=1.13,<2",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "xlrd>=2.0.1,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0.1,<7",
  "typer>=0.12,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "xlwt>=1.3,<2",
]

[project.scripts]
family-cfo = "family_cfo.cli:main"

[project.urls]
Homepage = "https://example.invalid/family-cfo"

[tool.hatch.build.targets.wheel]
packages = ["src/family_cfo"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "family_cfo/migrations"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
  "error::DeprecationWarning:family_cfo.*",
]
markers = [
  "slow: slow tests",
  "feishu: tests that exercise the Feishu client against the local mock",
]

[tool.ruff]
target-version = "py311"
line-length = 100
